name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sweety
          POSTGRES_PASSWORD: sweety_ci
          POSTGRES_DB: sweety_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sweety -d sweety_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://sweety:sweety_ci@localhost:5432/sweety_test
      TEST_DATABASE_URL: postgresql://sweety:sweety_ci@localhost:5432/sweety_test
      APP_ORIGIN: http://localhost:5173
      APP_TIMEZONE: Asia/Kolkata
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix backend
      - run: npm run build --prefix backend
      - run: npm run db:migrate --prefix backend
      - name: API tests in isolated schemas
        run: npm test --prefix backend
        env:
          DATABASE_URL: postgresql://sweety:sweety_ci@localhost:5432/unused
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm exec --prefix frontend -- playwright install --with-deps chromium
      - run: npm run test:e2e --prefix frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
