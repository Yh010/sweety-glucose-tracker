name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sweety
          POSTGRES_PASSWORD: sweety_ci
          POSTGRES_DB: sweety_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sweety -d sweety_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://sweety:sweety_ci@localhost:5432/sweety_test
      TEST_DATABASE_URL: postgresql://sweety:sweety_ci@localhost:5432/sweety_test
      APP_ORIGIN: http://localhost:5173
      APP_TIMEZONE: Asia/Kolkata
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix backend
      - run: npm run build --prefix backend
      - run: npm run db:migrate --prefix backend
      - name: API tests in isolated schemas
        run: npm test --prefix backend
        env:
          DATABASE_URL: postgresql://sweety:sweety_ci@localhost:5432/unused
      - run: npm run test:extras --prefix backend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run format:check --prefix frontend
      # Chrome is included in the hosted Ubuntu image; avoid a second apt/browser install.
      - run: google-chrome --version
      - run: npm run test:e2e --prefix frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
