services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety_local
      POSTGRES_DB: sweety
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety -d sweety"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
